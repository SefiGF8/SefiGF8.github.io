<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Sol animado</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<script>

let x, y, d, v;

function setup() {
    createCanvas(1000, 800);

    // Tamaño del sol
    d = min(width, height) * 0.10;

    // Posición inicial 
    x = -d;
    y = height * 0.20;

    // Velocidad
    v = 2;
}

function draw() {

    // CIELO
    background(51, 204, 204);

    // ☀️ SOL
    fill(255, 255, 0);
    stroke(255, 255, 0);
    circle(x, y, d);

    // Movimiento del sol
    x += v;

    // Cuando sale de la derecha, vuelve a entrar por la izquierda
    if (x > width + d) {
        x = -d;
    }

    // PRADO
    fill(34, 139, 34);
    stroke(0);
    rect(0, 600, 1000, 200);
}

</script>
</body>
</html>
