<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema Solar</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
</head>
<body>

<script>
// VARIABLES
let centerX, centerY, sunSize, R1;

// Planetas
let mercuryR, mercuryD, mercuryTheta, mercuryOmega;
let venusR, venusD, venusTheta, venusOmega;
let earthR, earthD, earthTheta, earthOmega;
let marsR, marsD, marsTheta, marsOmega;
let jupiterR, jupiterD, jupiterTheta, jupiterOmega;
let saturnR, saturnD, saturnTheta, saturnOmega;
let uranusR, uranusD, uranusTheta, uranusOmega;
let neptuneR, neptuneD, neptuneTheta, neptuneOmega;

// Luna
let moonR, moonD, moonTheta, moonOmega;

function setup() {
  createCanvas(800, 800);
  let S = 0.4;

  centerX = width / 2;
  centerY = height / 2;

  sunSize = 0.20 * min(width, height) * S;
  R1 = 0.12 * min(width, height) * S;

  // Radios planetarios
  mercuryR = 1 * R1;
  venusR   = 2 * R1;
  earthR   = 3 * R1;
  marsR    = 4 * R1;
  jupiterR = 5 * R1;
  saturnR  = 6 * R1;
  uranusR  = 7 * R1;
  neptuneR = 8 * R1;

  // ❌ ERROR AQUÍ → moonR usaba earthD antes de crearlo
  // Lo quitamos temporalmente de aquí (NO CAMBIAMOS NADA MÁS)

  // Tamaños planetarios
  mercuryD = 0.10 * sunSize;
  venusD   = 0.25 * sunSize;
  earthD   = 0.26 * sunSize;
  marsD    = 0.14 * sunSize;
  jupiterD = 0.70 * sunSize;
  saturnD  = 0.60 * sunSize;
  uranusD  = 0.40 * sunSize;
  neptuneD = 0.38 * sunSize;

  // ✔️ AHORA SÍ: earthD YA EXISTE → moonR funciona
  moonR = 1.2 * earthD;
  moonD = 0.50 * earthD;

  // Ángulos iniciales planetas
  mercuryTheta = 0;
  venusTheta   = PI / 3;
  earthTheta   = PI / 2;
  marsTheta    = PI;
  jupiterTheta = 4 * PI / 3;
  saturnTheta  = 5 * PI / 3;
  uranusTheta  = 2.2 * PI;
  neptuneTheta = 2.6 * PI;

  moonTheta = 0;

  // Velocidades
  mercuryOmega = 0.030;
  venusOmega   = 0.012;
  earthOmega   = 0.010;
  marsOmega    = 0.008;
  jupiterOmega = 0.004;
  saturnOmega  = 0.003;
  uranusOmega  = 0.002;
  neptuneOmega = 0.0015;
  moonOmega = 0.080;
}

function draw() {
  background(0);

  // SOL
  fill(255, 200, 0);
  circle(centerX, centerY, sunSize);

  // TIERRA
  fill(0, 150, 255);
  let xe = centerX + cos(earthTheta) * earthR;
  let ye = centerY + sin(earthTheta) * earthR;
  circle(xe, ye, earthD);

  // ORBITA DE LA LUNA
  noFill();
  stroke(255);
  strokeWeight(2);
  circle(xe, ye, moonR * 2);
  noStroke();

  // LUNA
  fill(220);
  let xmo = xe + cos(moonTheta) * moonR;
  let ymo = ye + sin(moonTheta) * moonR;
  circle(xmo, ymo, moonD);

  // MERCURIO
  fill(200);
  let xm = centerX + cos(mercuryTheta) * mercuryR;
  let ym = centerY + sin(mercuryTheta) * mercuryR;
  circle(xm, ym, mercuryD);

  // VENUS
  fill(255, 180, 0);
  let xv = centerX + cos(venusTheta) * venusR;
  let yv = centerY + sin(venusTheta) * venusR;
  circle(xv, yv, venusD);

  // MARTE
  fill(255, 60, 40);
  let xma = centerX + cos(marsTheta) * marsR;
  let yma = centerY + sin(marsTheta) * marsR;
  circle(xma, yma, marsD);

  // JÚPITER
  fill(210, 160, 120);
  let xj = centerX + cos(jupiterTheta) * jupiterR;
  let yj = centerY + sin(jupiterTheta) * jupiterR;
  circle(xj, yj, jupiterD);

  // SATURNO
  fill(230, 200, 100);
  let xs = centerX + cos(saturnTheta) * saturnR;
  let ys = centerY + sin(saturnTheta) * saturnR;
  circle(xs, ys, saturnD);

  // URANO
  fill(150, 220, 255);
  let xu = centerX + cos(uranusTheta) * uranusR;
  let yu = centerY + sin(uranusTheta) * uranusR;
  circle(xu, yu, uranusD);

  // NEPTUNO
  fill(60, 100, 255);
  let xn = centerX + cos(neptuneTheta) * neptuneR;
  let yn = centerY + sin(neptuneTheta) * neptuneR;
  circle(xn, yn, neptuneD);

  // ACTUALIZAR ÁNGULOS
  mercuryTheta += mercuryOmega;
  venusTheta   += venusOmega;
  earthTheta   += earthOmega;
  marsTheta    += marsOmega;
  jupiterTheta += jupiterOmega;
  saturnTheta  += saturnOmega;
  uranusTheta  += uranusOmega;
  neptuneTheta += neptuneOmega;

  moonTheta += moonOmega + earthOmega; 
}

</script>

</body>
</html>
