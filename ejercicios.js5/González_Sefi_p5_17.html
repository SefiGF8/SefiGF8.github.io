<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tarea 17</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>

<script>

let xS, yS, dS, rS, vS;
let xL, yL, dL, rL, vL;
let dia, mes, anio;

let xP, yP, S, vP;
let groundY, vY, jumpV, g;

// Disparo
let xD, yD;
let tD, vD;
let disparoActivo;

// Objetivo
let xO, yO, wO, hO, vO;

// Puntos
let puntos;

// -------- T17 --------
// Obstáculo
let xB, yB, wB, hB, vB;

// Estado del juego
let gameOver;

function setup() {
  createCanvas(1000, 800);

  // Sol
  dS = min(width, height) * 0.10;
  rS = dS / 2;
  xS = -rS;
  yS = height * 0.20;
  vS = width / 400;

  // Luna
  dL = dS * 0.5;
  rL = dL / 2;
  xL = -width - rL;
  yL = height * 0.30;
  vL = vS;

  // Calendario
  dia = 1;
  mes = 1;
  anio = 2025;

  // Stickman
  groundY = height * 0.75;
  S = 0.12 * min(width, height);
  xP = 0.25 * width;
  yP = groundY;
  vP = width / 150;

  vY = 0;
  jumpV = -0.03 * height;
  g = 0.0016 * height;

  // Disparo
  tD = width * 0.02;
  vD = height * 0.02;
  disparoActivo = false;

  // Objetivo
  wO = width * 0.08;
  hO = height * 0.05;
  yO = height * 0.25;
  reiniciarObjetivo();

  // Puntos
  puntos = 0;

  // ----- T17 -----
  wB = width * 0.06;
  hB = height * 0.06;
  yB = groundY - hB;
  xB = width;
  vB = -4;

  gameOver = false;
}

function draw() {

  if (xS <= width + rS) background(51, 204, 204);
  else background(10);

  noStroke();
  fill(34, 139, 34);
  rect(0, groundY, width, height * 0.25);

  dibujarSol();
  dibujarLuna();

  if (gameOver == false) {

    // Movimiento sol y luna
    xS += vS;
    xL += vL;

    if (xS > 2 * width + rS) {
      xS = -rS;
      xL = -width - rL;
      actualizarCalendario();
    }

    // Objetivo
    xO = xO + vO;
    if (xO > width + wO || xO < -wO) {
      reiniciarObjetivo();
    }

    // Disparo
    if (disparoActivo == true) {
      yD = yD - vD;

      if (yD < 0) {
        disparoActivo = false;
      }

      if (
        xD > xO &&
        xD < xO + wO &&
        yD > yO &&
        yD < yO + hO
      ) {
        puntos = puntos + 1;
        disparoActivo = false;
        reiniciarObjetivo();
      }
    }

    // Movimiento stickman
    if (keyIsDown(LEFT_ARROW)) xP -= vP;
    else if (keyIsDown(RIGHT_ARROW)) xP += vP;

    xP = constrain(xP, 0, width);

    vY += g;
    yP += vY;

    if (yP > groundY) {
      yP = groundY;
      vY = 0;
    }

    // ----- Obstáculo -----
    xB = xB + vB;

    if (xB < -wB) {
      xB = width;
      vB = random(-6, -3);
    }

    // ----- Colisión -----
    let stickIzq = xP - S * 0.2;
    let stickDer = xP + S * 0.2;
    let stickArr = yP - S;
    let stickAba = yP;

    let obstIzq = xB;
    let obstDer = xB + wB;
    let obstArr = yB;
    let obstAba = yB + hB;

    let colX = stickDer > obstIzq && stickIzq < obstDer;
    let colY = stickAba > obstArr && stickArr < obstAba;

    if (colX && colY) {
      gameOver = true;
    }
  }

  dibujarObjetivo();

  if (disparoActivo == true) {
    dibujarDisparo();
  }

  dibujarObstaculo();
  dibujarStickman();
  dibujarCalendario();
  dibujarPuntos();

  if (gameOver == true) {
    dibujarGameOver();
  }
}

function keyPressed() {

  if (gameOver == false) {

    if (keyCode === UP_ARROW && yP >= groundY) {
      vY = jumpV;
    }

    if (key === ' ' && disparoActivo == false) {
      xD = xP;
      yD = yP;
      disparoActivo = true;
    }
  }
}

function dibujarSol() {
  fill(255, 255, 0);
  circle(xS, yS, dS);
}

function dibujarLuna() {
  fill(200);
  circle(xL, yL, dL);
}

function dibujarObjetivo() {
  fill(255, 0, 0);
  rect(xO, yO, wO, hO);
}

function dibujarDisparo() {
  fill(255);
  ellipse(xD, yD, tD);
}

function dibujarObstaculo() {
  fill(0, 0, 255);
  rect(xB, yB, wB, hB);
}

function dibujarStickman() {
  let rHead = 0.20 * S;
  let bodyL = 0.60 * S;
  let armL  = 0.45 * S;
  let legL  = 0.55 * S;

  let hipY = yP - legL;
  let shoulderY = hipY - bodyL;
  let headY = shoulderY - rHead;

  stroke(255, 0, 0);
  strokeWeight(0.06 * S);
  noFill();

  circle(xP, headY, 2 * rHead);
  line(xP, shoulderY, xP, hipY);

  line(xP - 0.25 * S, shoulderY, xP + 0.25 * S, shoulderY);
  line(xP - 0.25 * S, shoulderY, xP - 0.25 * S, shoulderY + armL);
  line(xP + 0.25 * S, shoulderY, xP + 0.25 * S, shoulderY + armL);

  line(xP, hipY, xP - 0.18 * S, yP);
  line(xP, hipY, xP + 0.18 * S, yP);
}

function dibujarCalendario() {
  if (xS <= width + rS) fill(0);
  else fill(255);
  textSize(20);
  text("Fecha: (" + dia + ") (" + mes + ") (" + anio + ")", 10, 30);
}

function dibujarPuntos() {
  if (xS <= width + rS) fill(0);
  else fill(255);
  textSize(20);
  text("Puntos: " + puntos, 10, 60);
}

function dibujarGameOver() {
  fill(255, 0, 0);
  textSize(60);
  textAlign(CENTER);
  text("GAME OVER", width/2, height/2);
  textSize(30);
  text("Puntos: " + puntos, width/2, height/2 + 50);
}

function actualizarCalendario() {
  dia++;
  if (dia > 30) { dia = 1; mes++; }
  if (mes > 12) { mes = 1; anio++; }
}

function reiniciarObjetivo() {
  let direccion = random(-1, 1);
  if (direccion < 0) vO = random(-5, -2);
  else vO = random(2, 5);

  if (vO > 0) xO = -wO;
  else xO = width + wO;
}

</script>

</body>
</html>
