<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba 3D</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>

  <a-scene>

    <!-- Fondo -->
    <a-sky color="#222"></a-sky>

    <!-- Suelo -->
    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="6"
      height="6"
      color="#555">
    </a-plane>

    <!-- PRIMER OBJETO (COCHE) -->
    <a-entity id="coche" position="-1 0 -4">

      <!-- Base del coche -->
      <a-box
        position="0 0.3 0"
        width="1"
        height="0.3"
        depth="0.5"
        color="red">
      </a-box>

      <!-- Cabina -->
      <a-box
        position="0 0.55 0"
        width="0.6"
        height="0.3"
        depth="0.5"
        color="#ff6666">
      </a-box>

      <!-- Rueda 1 -->
      <a-cylinder
        position="-0.35 0.15 0.25"
        radius="0.12"
        height="0.1"
        rotation="90 0 0"
        color="black">
      </a-cylinder>

      <!-- Rueda 2 -->
      <a-cylinder
        position="0.35 0.15 0.25"
        radius="0.12"
        height="0.1"
        rotation="90 0 0"
        color="black">
      </a-cylinder>

      <!-- Rueda 3 -->
      <a-cylinder
        position="-0.35 0.15 -0.25"
        radius="0.12"
        height="0.1"
        rotation="90 0 0"
        color="black">
      </a-cylinder>

      <!-- Rueda 4 -->
      <a-cylinder
        position="0.35 0.15 -0.25"
        radius="0.12"
        height="0.1"
        rotation="90 0 0"
        color="black">
      </a-cylinder>

    </a-entity>

    <!-- SEGUNDO OBJETO -->
    <a-entity id="modelo2" position="1 0 -4">

      <!-- Base -->
      <a-box
        position="0 0.3 0"
        width="0.5"
        height="0.6"
        depth="0.5"
        color="green">
      </a-box>

      <!-- Torre -->
      <a-cylinder
        position="0 0.9 0"
        radius="0.1"
        height="0.6"
        color="yellow">
      </a-cylinder>

      <!-- Esfera arriba -->
      <a-sphere
        position="0 1.4 0"
        radius="0.2"
        color="purple">
      </a-sphere>

    </a-entity>

    <!-- Cámara -->
    <a-camera position="0 1.6 0"></a-camera>

  </a-scene>

</body>
</html>
